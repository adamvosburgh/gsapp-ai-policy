# A "Syllabus:" issue, opened by the form on references.html, is added to
# syllabi.json and closed. The issue body reaches the script only through an
# environment variable, never interpolated into a shell command.
name: Add syllabus

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: syllabi
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Syllabus:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: add
        run: node .github/scripts/add-syllabus.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - if: steps.add.outputs.added == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add syllabi.json
          git commit -m "Add syllabus from #${{ github.event.issue.number }}"
          git push
          # Pushes made with this token may not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          gh issue close ${{ github.event.issue.number }} --comment "Added to the reference syllabi. It will appear on the site in a few minutes."
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.add.outputs.error != ''
        run: gh issue comment ${{ github.event.issue.number }} --body "This syllabus could not be added: $ERROR Please submit it again from the reference syllabi page."
        env:
          GH_TOKEN: ${{ github.token }}
          ERROR: ${{ steps.add.outputs.error }}
